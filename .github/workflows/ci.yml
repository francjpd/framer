name: CI

# Register the same checks the no-mistakes gate expects: every pull request
# and every push to the default branch. `master` is the repository default
# (`origin/HEAD`); `main` is kept as an alias so a future rename still runs.
on:
  push:
    branches: ['master', 'main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Python engine + Elixir editor
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # FramerCore.PortWorker resolves FRAMER_PYTHON first, then
      # <repo>/.venv/bin/python. Pin it so the Elixir suite always spawns the
      # uv-managed interpreter that has OpenCV installed, instead of silently
      # excluding the :requires_cv2 integration tests.
      FRAMER_PYTHON: ${{ github.workspace }}/.venv/bin/python

    steps:
      - uses: actions/checkout@v4

      # FFmpeg drives the media-generated operation tests; libgl1/libglib2.0-0
      # are the system libraries the opencv-python wheel loads at import.
      # Chromium drives the editor's browser preview suite (tests/browser,
      # playwright-core): the runner image already ships a real Chromium at
      # /usr/bin/chromium (chrome-linux; needs the --no-sandbox the runner
      # passes), while Ubuntu 24.04's apt chromium-browser is only a snap stub
      # that cannot launch in CI - so only fall back to apt if the image ever
      # stops shipping the binary.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
          if ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends chromium-browser
          fi
          chromium --version
          echo "FRAMER_CHROMIUM=$(command -v chromium)" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      # Creates .venv/bin/python, the interpreter the Elixir Port suite and the
      # engine tests both use. `--locked` fails if pyproject.toml and uv.lock
      # have drifted, so CI proves the committed lock is current. The CPU-only
      # PyTorch index is configured in pyproject.toml.
      - name: Install Python dependencies
        run: uv sync --locked

      - name: Lint Python (Ruff)
        run: uv run ruff check .

      # tests/test_preview_parity.py runs lbs.mjs under Node and is otherwise
      # skipped, so the parity suite only counts if Node is on PATH.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installs the browser proof harness (playwright-core only, no browser
      # download - the suite drives the system Chromium above) from the
      # committed package-lock.json.
      - name: Install browser harness dependencies
        working-directory: tests/browser
        run: npm ci

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'

      - name: Fetch Elixir dependencies
        working-directory: framer
        run: mix deps.get

      # The browser suite loads the editor over HTTP/WebSocket, so the
      # gitignored priv/static assets must exist. esbuild/tailwind are
      # dev-only deps, hence the dev env.
      - name: Build editor assets
        working-directory: framer
        run: MIX_ENV=dev mix assets.setup assets.build

      - name: Test
        run: |
          uv run python -m pytest tests/ -q
          cd framer && mix test
